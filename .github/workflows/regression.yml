name: Offline regression
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check MCP replay harness syntax
        run: node --check evaluation/comparison/replay_mcp.mjs
      - name: Run offline regressions (including comparison tests)
        run: python evaluation/run_offline.py
      - name: Report priority checks 1, 5, 6, 9 and 10
        if: always()
        run: python evaluation/run_priority.py --report-dir test-results/priority
      - name: Preserve priority reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: priority-python-${{ matrix.python }}
          path: test-results/priority/
          if-no-files-found: error
          retention-days: 30
